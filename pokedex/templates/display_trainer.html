<html>
  <head>
    <title>Detalle del Entrenador</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/css/bootstrap.min.css"
      rel="stylesheet"
      crossorigin="anonymous"
    />
  </head>
  <body>
    <div class="container mt-4">
      <div class="bg-primary text-white p-4 text-center mb-4">
        <h1>Detalles del Entrenador</h1>
      </div>

      <h3>{{ trainer.first_name }} {{ trainer.last_name }}</h3>

      <ul class="list-group mt-3">
        <li class="list-group-item">
          <strong>Nivel:</strong> {{ trainer.level }}
        </li>
        <li class="list-group-item">
          <strong>Fecha de nacimiento:</strong> {{ trainer.birth_date }}
        </li>
      </ul>

      <a href="{% url 'index' %}" class="btn btn-secondary mt-4"
        >Volver al inicio</a
      >
    </div>
  </body>
</html>
