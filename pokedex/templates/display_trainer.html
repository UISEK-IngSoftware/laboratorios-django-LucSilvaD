{% extends 'base.html' %}
{% block title %}{{ trainer.first_name }} {{ trainer.last_name }}{% endblock %}

{% block content %}
<div class="container mt-4" style="max-width: 600px;">
    <div class="card pokemon-card shadow p-4 mb-5">
        <div class="card-body text-center">
            <div class="mb-3 text-secondary">
                <i class="fa-solid fa-user fa-4x"></i>
            </div>
            <h2 class="card-title mb-3" style="font-weight: bold; color: #222224;">{{ trainer.first_name }} {{ trainer.last_name }}</h2>

            <div class="p-3 mb-4 rounded bg-light text-start fs-6">
                <p class="mb-2"><i class="fa-solid fa-location-dot text-danger me-3"></i><strong>Ciudad:</strong> {{ trainer.city }}</p>
                <p class="mb-0"><i class="fa-solid fa-star text-warning me-3"></i><strong>Nivel de Entrenador:</strong> {{ trainer.level }}</p>
            </div>

            <a href="{% url 'pokedex:index' %}" class="btn btn-pokedex">
                <i class="fa-solid fa-arrow-left me-2"></i> Volver al inicio
            </a>
        </div>
    </div>
</div>
{% endblock %}
